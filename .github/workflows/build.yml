name: Build apps

# CI workflow for Grimoire: builds web, Android (debug/release), and iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  JAVA_VERSION: "21"

jobs:
  web:
    name: Web build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: pnpm build

  android-debug:
    name: Android debug APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: grimoire-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  android-release:
    name: Android release APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx cap sync android

      - name: Assemble release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: grimoire-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      # secrets.* is only valid in step-level conditions, never job-level.
      - name: Zipalign + sign
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | head -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | head -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ZIPALIGN" -f 4 "$UNSIGNED" app-aligned.apk
          "$APKSIGNER" sign --ks release.keystore \
            --ks-pass "pass:$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out Grimoire-release.apk app-aligned.apk
          "$APKSIGNER" verify Grimoire-release.apk
          rm -f app-aligned.apk release.keystore

      - uses: actions/upload-artifact@v4
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        with:
          name: grimoire-release-apk
          path: Grimoire-release.apk

  ios:
    name: iOS unsigned IPA
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx cap add ios
      - run: npx cap sync ios

      - name: Archive without signing
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive -archivePath "$PWD/build/Grimoire.xcarchive"

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r "build/Grimoire.xcarchive/Products/Applications/App.app" Payload/
          zip -r Grimoire-unsigned.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: grimoire-unsigned-ipa
          path: Grimoire-unsigned.ipa
